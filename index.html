<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-g">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="apiKeySetup">
        <h1>Gemini API 金鑰設定</h1>
        <p>請輸入您的 Gemini API 金鑰，此金鑰將會儲存在您的瀏覽器中。</p>
        <input type="password" id="apiKeyInput" placeholder="請輸入您的 Gemini API 金鑰">
        <button id="saveApiKeyButton">儲存</button>
    </div>

    <div id="chatContainer" class="hidden">
        <div id="chatHistory"></div>
        <div class="typing-indicator hidden">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div id="suggestionArea">
            <button class="suggestionButton">你好，請介紹一下自己</button>
            <button class="suggestionButton">用簡單的方式解釋什麼是 API</button>
            <button class="suggestionButton">給我三個學習 Github 的建議</button>
        </div>
        <div id="inputArea">
            <textarea id="messageInput" placeholder="請在這裡輸入訊息..."></textarea>
            <button id="sendMessageButton">傳送</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
